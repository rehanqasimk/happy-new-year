# This workflow will build and publish the package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish to GitHub Packages

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          registry-url: https://npm.pkg.github.com/
          scope: '@rehanqasimk'
      
      - name: Configure npm for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{secrets.GITHUB_TOKEN}}" >> ~/.npmrc
          echo "@rehanqasimk:registry=https://npm.pkg.github.com" >> ~/.npmrc
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build package
        run: npm run build
      
      - name: Verify bin field
        run: |
          node -e "const pkg = require('./package.json'); console.log('Bin field:', JSON.stringify(pkg.bin, null, 2));"
          test -f dist/index.js && echo "dist/index.js exists" || echo "ERROR: dist/index.js not found"
          head -1 dist/index.js | grep -q "#!/usr/bin/env node" && echo "Shebang found" || echo "WARNING: Shebang not found"
      
      - name: Publish to GitHub Packages
        run: npm publish
