# This workflow will automatically publish when you push a git tag
# Usage: git tag v1.0.4 && git push origin v1.0.4
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Auto Release and Publish

on:
  push:
    tags:
      - 'v*'  # Triggers on tags starting with 'v'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version from tag
        id: tag-version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"
      
      - name: Verify version matches package.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.tag-version.outputs.version }}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) doesn't match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi
          echo "Versions match: $PACKAGE_VERSION"
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          registry-url: https://npm.pkg.github.com/
          scope: '@rehanqasimk'
        env:
          NODE_AUTH_TOKEN: ${{secrets.ACCESS_TOKEN}}
      
      - name: Configure npm for GitHub Packages
        run: |
          rm -f .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{secrets.ACCESS_TOKEN}}" > ~/.npmrc
          echo "@rehanqasimk:registry=https://npm.pkg.github.com" >> ~/.npmrc
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build package
        run: npm run build
      
      - name: Verify bin field
        run: |
          node -e "const pkg = require('./package.json'); console.log('Bin field:', JSON.stringify(pkg.bin, null, 2));"
          test -f dist/index.js && echo "dist/index.js exists" || echo "ERROR: dist/index.js not found"
          head -1 dist/index.js | grep -q "#!/usr/bin/env node" && echo "Shebang found" || echo "WARNING: Shebang not found"
      
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.ACCESS_TOKEN}}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.tag-version.outputs.version }}
          name: Release v${{ steps.tag-version.outputs.version }}
          body: |
            ## Changes in v${{ steps.tag-version.outputs.version }}
            
            Automated release for version ${{ steps.tag-version.outputs.version }}
            
            ### Installation
            ```bash
            npx @rehanqasimk/happy-new-year@${{ steps.tag-version.outputs.version }}
            ```
        env:
          GITHUB_TOKEN: ${{secrets.ACCESS_TOKEN}}
